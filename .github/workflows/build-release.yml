name: Build & Release Subtitle Test
run-name: "Subtitle test ${{ github.event.inputs.tag_name || github.event.release.tag_name }}"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Published testing prerelease tag (for example v0.17.4-dev.1001)"
        required: true

permissions:
  contents: write

concurrency:
  group: subtitle-rename-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify testing release
    if: github.repository == 'leo-maxwell/ShokoRelay'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      source_revision: ${{ steps.version.outputs.source_revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Validate version and branch ancestry
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-dev\.([1-9][0-9]{3,4})$ ]]; then
            echo "Expected a testing tag such as v0.17.4-dev.1001."
            exit 1
          fi
          BASE_VERSION="${BASH_REMATCH[1]}"
          REVISION="${BASH_REMATCH[2]}"
          if (( REVISION < 1001 || REVISION > 65534 )); then
            echo "Testing revisions must be between 1001 and 65534."
            exit 1
          fi
          CODE_VERSION=$(sed -n 's/.*public const string Version = "\([^"]*\)";.*/\1/p' ShokoRelay/ShokoRelayConstants.cs)
          test "$BASE_VERSION" = "$CODE_VERSION"
          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true
          git merge-base --is-ancestor origin/subtitle-rename HEAD
          git merge-base --is-ancestor HEAD origin/subtitle-rename-testing
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "assembly_version=$BASE_VERSION.$REVISION" >> "$GITHUB_OUTPUT"
          echo "source_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore ShokoRelay.slnx
      - name: Build
        run: dotnet build ShokoRelay.slnx --no-restore -c Release
      - name: Test
        run: dotnet test ShokoRelay.Tests/ShokoRelay.Tests.csproj --no-build --no-restore -c Release

  publish:
    name: Build & attach ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >-
          dotnet publish ShokoRelay/ShokoRelay.csproj -c Release
          -r ${{ matrix.rid }} --no-self-contained -o publish
          -p:AssemblyVersion=${{ needs.verify.outputs.assembly_version }}
          -p:FileVersion=${{ needs.verify.outputs.assembly_version }}
          -p:InformationalVersion=${{ needs.verify.outputs.version }}
          -p:RepositoryUrl=https://github.com/leo-maxwell/ShokoRelay
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          RELEASE_CHANNEL: Dev

      - name: Package ZIP (Linux)
        if: runner.os == 'Linux'
        id: pkg_linux
        shell: bash
        run: |
          ZIP_NAME="ShokoRelay-v${{ needs.verify.outputs.version }}_${{ matrix.rid }}.zip"
          cd publish
          zip -r "../$ZIP_NAME" .
          echo "zip_path=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Package ZIP (Windows)
        if: runner.os == 'Windows'
        id: pkg_win
        shell: pwsh
        run: |
          $ZipName = "ShokoRelay-v${{ needs.verify.outputs.version }}_${{ matrix.rid }}.zip"
          Compress-Archive -Path publish\* -DestinationPath "$env:GITHUB_WORKSPACE\$ZipName" -Force
          echo "zip_path=$ZipName" >> $env:GITHUB_OUTPUT

      - name: Upload asset to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          ZIP_PATH: ${{ runner.os == 'Windows' && steps.pkg_win.outputs.zip_path || steps.pkg_linux.outputs.zip_path }}
        run: |
          gh release upload "$TAG" "$ZIP_PATH"

  update-manifest:
    name: Update testing manifest
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: subtitle-rename-testing
          fetch-depth: 0

      - name: Update Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_REVISION: ${{ needs.verify.outputs.source_revision }}
        run: |
          set -euo pipefail

          # Extract Shoko.Abstractions version dynamically from csproj
          ABSTRACTION_VERSION=$(git show "$SOURCE_REVISION:ShokoRelay/ShokoRelay.csproj" | sed -n 's/.*Include="Shoko.Abstractions" Version="\([^"]*\)".*/\1/p')
          if [ -z "$ABSTRACTION_VERSION" ]; then
            echo "Error: Missing Shoko.Abstractions version in ShokoRelay.csproj"
            exit 1
          fi
          ABSTRACTION_VERSION="${ABSTRACTION_VERSION%%-*}"

          # Fetch release metadata from API (including the body for release_notes)
          RELEASE_DATA=$(gh release view "$TAG" --repo "${{ github.repository }}" --json publishedAt,isPrerelease,body)
          RELEASED_AT=$(echo "$RELEASE_DATA" | jq -r .publishedAt)
          IS_PRERELEASE=$(echo "$RELEASE_DATA" | jq -r .isPrerelease)
          RELEASE_NOTES=$(echo "$RELEASE_DATA" | jq -r .body)
          CHANNEL=$([[ "$IS_PRERELEASE" == "true" ]] && echo "Dev" || echo "Stable")

          # Download all release assets
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "ShokoRelay-v${VERSION}_*.zip"

          # Build archives JSON array
          ARCHIVES_JSON="[]"
          for RID in linux-arm64 linux-x64 win-x64; do
            ZIP="ShokoRelay-v${VERSION}_${RID}.zip"
            CHECKSUM="sha256:$(sha256sum "$ZIP" | awk '{ print $1 }')"
            URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP}"
            ARCHIVE_ENTRY=$(jq -n \
              --arg runtime "$RID" \
              --arg abstraction "$ABSTRACTION_VERSION" \
              --arg url "$URL" \
              --arg checksum "$CHECKSUM" \
              '{runtime: $runtime, abstraction: $abstraction, url: $url, checksum: $checksum}')
            ARCHIVES_JSON=$(echo "$ARCHIVES_JSON" | jq --argjson entry "$ARCHIVE_ENTRY" '. += [$entry]')
          done

          RELEASE_ENTRY=$(jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg released_at "$RELEASED_AT" \
            --arg channel "$CHANNEL" \
            --arg release_notes "$RELEASE_NOTES" \
            --argjson archives "$ARCHIVES_JSON" \
            '{version: $version, tag: $tag, source_revision: $source_revision, released_at: $released_at, channel: $channel, release_notes: $release_notes, archives: $archives}')

          jq --argjson release "$RELEASE_ENTRY" '
            .releases |= [ $release ] + (. | map(select(.version != $release.version)))
          ' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json

          # Exit cleanly without committing if the manifest hasn't actually changed
          if git diff --quiet manifest.json; then
            echo "manifest.json unchanged, skipping commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "ci: update subtitle testing manifest for ${TAG}"
          git push origin HEAD:subtitle-rename-testing
